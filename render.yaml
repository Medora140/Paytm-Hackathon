services:
  - type: web
    name: money-docs-decoded-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: REQUIRE_REMOTE_STORAGE
        value: "true"
      - key: SUPABASE_STORAGE_BUCKET
        value: InsuranceFiles
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: N8N_WEBHOOK_SECRET
        sync: false
