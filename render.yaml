services:
  # Backend Web Service (FastAPI Docker)
  - type: web
    name: money-docs-decoded-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: REQUIRE_REMOTE_STORAGE
        value: "false"
      - key: ALLOW_IN_MEMORY_FALLBACKS
        value: "true"
      - key: SUPABASE_STORAGE_BUCKET
        value: InsuranceFiles
      - key: SARVAM_MODEL
        value: sarvam-m
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: N8N_WEBHOOK_SECRET
        sync: false

  # Frontend Web Service (Next.js Node)
  - type: web
    name: money-docs-decoded-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

